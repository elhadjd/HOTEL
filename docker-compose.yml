# SIGESC Hotelaria — local MySQL 8.0 (Phase 6+)
services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: hotelaria_root
      MYSQL_USER: hotelaria
      MYSQL_PASSWORD: hotelaria
      MYSQL_DATABASE: sigesc_hotelaria
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    volumes:
      - hotelaria_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhotelaria", "-photelaria"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hotelaria_mysql:
