services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hotelaria
      POSTGRES_PASSWORD: hotelaria
      POSTGRES_DB: sigesc_hotelaria
    volumes:
      - hotelaria_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelaria -d sigesc_hotelaria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotelaria_pg:
